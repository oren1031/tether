# Pushing a tag like v0.3.0 tests Tether, builds the Arch package, the
# AppImage, the Windows installer and the Android APK, signs the release's
# list of files, and publishes them as a GitHub release, which installed
# copies offer as an update. Running it by hand builds everything without
# publishing.
#
# A tagged release needs three repository secrets (Settings > Secrets):
#   ANDROID_KEYSTORE           the release keystore (.p12) as one line of base64
#   ANDROID_KEYSTORE_PASSWORD  its password
#   UPDATE_SIGNING_KEY         the update-signing private key, the text of the
#                              OpenSSH ed25519 key file (BEGIN ... END lines)
# Without them a tagged run stops at once (the "check" job) instead of
# publishing a release that phones or desktops would refuse.
#
# Third-party actions are pinned to a commit (the version is in the comment);
# .github/dependabot.yml proposes updates. Jobs get a read-only token; only
# "publish" can write.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap checks first, so a tag that can't be published fails in seconds.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "^VERSION = $want\$" tether.pro || { echo "tether.pro VERSION isn't $want"; exit 1; }
          grep -q "^pkgver=$want\$" pkgbuild/PKGBUILD || { echo "PKGBUILD pkgver isn't $want"; exit 1; }

      - name: Check the signing secrets and keys
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD UPDATE_SIGNING_KEY; do
            eval "value=\$$name"
            [ -n "$value" ] || { echo "::error::the repository secret $name is not set; a release without it can't be installed over the last one"; exit 1; }
          done
          # The update key must be the one built into the app, or every
          # installed copy would refuse this release.
          bin/sign-release --try
          # The Android key must be the one the last release was signed with.
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/release.p12" -passin env:ANDROID_KEYSTORE_PASSWORD -nokeys -legacy 2>/dev/null \
            | openssl x509 -outform der | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/cert.sha256" \
            || { echo "::error::couldn't read the Android keystore with its password"; exit 1; }
          rm -f "$RUNNER_TEMP/release.p12"
          if [ "$(cat "$RUNNER_TEMP/cert.sha256")" != "$(cat packaging/android/release-cert.sha256)" ]; then
            echo "::error::the Android keystore (or its password) isn't the release key recorded in packaging/android/release-cert.sha256"
            exit 1
          fi
          echo "Secrets present; the update key and the Android key are the expected ones."

  arch:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools and Qt
        run: |
          pacman -Syu --noconfirm --needed base-devel git \
            qt6-base qt6-declarative qt6-svg qt6-wayland openssh picocom libssh

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # As a normal user, like people run Tether: root can open any device,
      # so the serial permission checks would mean nothing.
      - name: Test
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "bin/test"

      # makepkg won't run as root either. The app itself is built here for
      # the first time, with the update source set.
      - name: Build the package
        env:
          TETHER_REPO: ${{ github.repository }}
        run: su builder -c "cd pkgbuild && TETHER_REPO=$TETHER_REPO makepkg -f --nodeps"

      - name: Self-test
        run: su builder -c "QT_QPA_PLATFORM=offscreen build/tether --self-test"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-${{ github.run_attempt }}
          path: pkgbuild/tether-[0-9]*-x86_64.pkg.tar.zst

  # Built on the oldest supported Ubuntu, so the AppImage runs on it and
  # anything newer, with Qt inside. Qt Serial Port lets it open serial ports
  # itself where picocom isn't installed.
  appimage:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfuse2 file

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.*'
          modules: 'qtserialport'
          cache: true

      - name: Test
        env:
          QMAKE: qmake
        run: bin/test

      - name: Build Tether
        env:
          QMAKE: qmake
          TETHER_REPO: ${{ github.repository }}
        run: bin/build

      # linuxdeploy and its Qt plugin only publish a rolling "continuous" build
      # for these versions, so they are pinned by checksum: if upstream
      # replaces one, this step stops instead of packaging with an unknown
      # tool. To update: download both, test an AppImage, put the new sums here.
      - name: Package the AppImage
        run: |
          base=https://github.com/linuxdeploy
          fetch() {
            wget -q -O "$2" "$1"
            echo "$3  $2" | sha256sum -c - || { echo "::error::$2 isn't the build pinned in release.yml (upstream replaced it?)"; exit 1; }
          }
          fetch "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" \
            linuxdeploy-x86_64.AppImage df908b19f1ed1cdafa79508d415aa12d6c56ce4d56d4149aa8c09286718706e5
          fetch "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" \
            linuxdeploy-plugin-qt-x86_64.AppImage cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617
          chmod +x linuxdeploy*.AppImage
          version=$(sed -n 's/^VERSION = //p' tether.pro)
          export QML_SOURCES_PATHS="$PWD/src" EXTRA_QT_MODULES="svg" LDAI_OUTPUT="Tether-$version-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/tether \
            -d pkgbuild/tether.desktop -i pkgbuild/tether.svg --plugin qt --output appimage

      - name: Self-test the AppImage
        run: QT_QPA_PLATFORM=offscreen ./Tether-*-x86_64.AppImage --self-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ github.run_attempt }}
          path: Tether-*-x86_64.AppImage

  # Windows 10 1809 and later: ConPTY for terminals, the built-in OpenSSH
  # client for ssh, Qt Serial Port for COM ports, and Credential Manager for
  # vault passwords. Inno Setup makes a per-user installer.
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.*'
          arch: 'win64_msvc2022_64'
          modules: 'qtserialport'
          cache: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build Tether
        shell: cmd
        env:
          TETHER_REPO: ${{ github.repository }}
        run: |
          mkdir build
          cd build
          qmake ..\tether.pro CONFIG+=release
          nmake

      - name: Gather Qt beside it
        shell: cmd
        run: windeployqt --release --qmldir src --no-translations --no-system-d3d-compiler --no-opengl-sw build\bin\tether.exe

      # tether.exe is a GUI program, so its report goes through a file.
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process build\bin\tether.exe -ArgumentList '--self-test','tether-windows.png' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt
          Get-Content selftest-err.txt
          exit $p.ExitCode

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-screenshot-${{ github.run_attempt }}
          path: tether-windows.png

      - name: Make the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path tether.pro -Pattern '^VERSION = (.+)$').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DSource=$PWD\build\bin" packaging\windows\tether.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ github.run_attempt }}
          path: dist/Tether-*-setup.exe

  # Android 9 and later, on 64-bit ARM phones and tablets. The APK is signed
  # with the release key kept in the repository's secrets, so each version
  # installs over the last. A tagged build without that key fails; a manual
  # run signs with a throwaway key and says so.
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK parts
        run: |
          sdk="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.*'
          # Qt 6.7 and later list Android under all_os; autodesktop adds the
          # Linux Qt that the Android build's tools need.
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          autodesktop: true
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/tether-libssh
          key: libssh-0.12.2-openssl-b71f147-arm64-v8a-${{ hashFiles('packaging/android/build-libssh.sh') }}

      - name: Build the APK
        env:
          TETHER_REPO: ${{ github.repository }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TETHER_REQUIRE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          sudo apt-get install -y librsvg2-bin ninja-build >/dev/null
          version=$(sed -n 's/^VERSION = //p' tether.pro)
          packaging/android/build-apk.sh arm64-v8a "$PWD/Tether-$version-android-arm64.apk"

      # Phones only install an update signed with the same key as the app
      # they have; compare before anything is uploaded.
      - name: Check the APK is signed with the release key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          got=$(packaging/android/apk-cert Tether-*-android-arm64.apk)
          want=$(cat packaging/android/release-cert.sha256)
          echo "APK certificate: $got"
          [ "$got" = "$want" ] || { echo "::error::the APK is not signed with the release key ($want)"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ github.run_attempt }}
          path: Tether-*-android-arm64.apk

  # The same app built for x86_64 and run in an Android emulator: the
  # self-test, then a screenshot of it running.
  android-emulator:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK parts
        run: |
          sdk="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          sudo apt-get install -y librsvg2-bin ninja-build >/dev/null

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.*'
          host: 'all_os'
          target: 'android'
          arch: 'android_x86_64'
          autodesktop: true
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/tether-libssh
          key: libssh-0.12.2-openssl-b71f147-x86_64-${{ hashFiles('packaging/android/build-libssh.sh') }}

      - name: Build the APK
        env:
          # Only this test build has the self-test and test switches.
          TETHER_TEST_HOOKS: '1'
        run: packaging/android/build-apk.sh x86_64 "$PWD/Tether-test-x86_64.apk"

      # A throwaway sshd on this machine for the built-in ssh to log in to.
      - name: Start an sshd to test against
        run: |
          command -v /usr/sbin/sshd >/dev/null || sudo apt-get install -y openssh-server >/dev/null
          t="$RUNNER_TEMP/sshd"
          mkdir -p "$t"
          ssh-keygen -q -t ed25519 -N "" -f "$t/host"
          ssh-keygen -q -t ed25519 -N "" -f "$t/client"
          cp "$t/client.pub" "$t/authorized_keys"
          printf 'Port 2222\nListenAddress 0.0.0.0\nHostKey %s/host\nAuthorizedKeysFile %s/authorized_keys\nPasswordAuthentication no\nKbdInteractiveAuthentication no\nUsePAM no\nStrictModes no\nPidFile %s/sshd.pid\n' "$t" "$t" "$t" > "$t/sshd_config"
          /usr/sbin/sshd -f "$t/sshd_config" -E "$t/sshd.log"
          echo "SSH_TEST=$(whoami)@10.0.2.2:2222" >> "$GITHUB_ENV"
          echo "SSH_TEST_KEY=$t/client" >> "$GITHUB_ENV"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Self-test in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Android 15 and later draw edge-to-edge, where 0.5.3's layout bugs showed.
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # ANGLE on SwiftShader's Vulkan draws GLES much more faithfully than
          # the default software renderer.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: packaging/android/emulator-test.sh Tether-test-x86_64.apk tether-android.png

      - name: Check typing reached the ssh session
        run: |
          if [ -f /tmp/tether-typed-on-android ]; then
            echo "Typed on Android, ran on the server."
          else
            echo "The command typed on Android never ran on the server."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-screenshot-${{ github.run_attempt }}
          path: tether-android*.png

  publish:
    needs: [check, arch, appimage, windows, android, android-emulator]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # attest where the files were built
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every attempt of this run left its own artifacts (arch-1, arch-2, ...):
      # take the newest attempt of each, never an older build of the same file.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect the newest build of each file
        run: |
          mkdir dist
          for kind in arch appimage windows android; do
            newest=$(ls -d artifacts/$kind-[0-9]* | sed "s#.*$kind-##" | sort -n | tail -n 1)
            [ -n "$newest" ] || { echo "::error::no $kind build"; exit 1; }
            echo "$kind: attempt $newest"
            cp artifacts/$kind-$newest/* dist/
          done
          ls -la dist
          # Exactly the four files people download, and nothing else.
          [ "$(ls dist | wc -l)" = 4 ] || { echo "::error::expected 4 files"; exit 1; }

      - name: Check the APK again before publishing it
        run: |
          got=$(packaging/android/apk-cert dist/Tether-*-android-arm64.apk)
          [ "$got" = "$(cat packaging/android/release-cert.sha256)" ] \
            || { echo "::error::the APK isn't signed with the release key"; exit 1; }

      # The release notes: this version's part of CHANGELOG.md when it has
      # one, else GitHub's generated list.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { on = ($0 ~ "^## \\[?" v "[] ]|^## \\[?" v "$") ; next }
            on' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || rm -f notes.md
          ls notes.md 2>/dev/null || echo "no CHANGELOG entry for $version; GitHub will generate notes"

      # latest.json (each file's size and SHA-256) and SHA256SUMS, with
      # signatures: what installed copies of Tether and install.sh check.
      - name: Sign the release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=""; [ -f notes.md ] && notes="--notes notes.md"
          bin/sign-release dist "$version" --page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" $notes
          ls -la dist

      - name: Attest where the files were built
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            if [ -f notes.md ]; then notes="--notes-file notes.md"; else notes="--generate-notes"; fi
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Tether ${GITHUB_REF_NAME#v}" $notes
          fi
