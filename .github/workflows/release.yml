# Pushing a tag like v0.3.0 tests Tether, builds the Arch package, the
# AppImage, and the Windows installer, and publishes them as a GitHub release,
# which installed copies offer as an update. Running it by hand builds
# everything without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools and Qt
        run: |
          pacman -Syu --noconfirm --needed base-devel git \
            qt6-base qt6-declarative qt6-svg qt6-wayland openssh picocom

      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "^VERSION = $want\$" tether.pro || { echo "tether.pro VERSION isn't $want"; exit 1; }
          grep -q "^pkgver=$want\$" pkgbuild/PKGBUILD || { echo "PKGBUILD pkgver isn't $want"; exit 1; }

      # As a normal user, like people run Tether: root can open any device,
      # so the serial permission checks would mean nothing.
      - name: Test
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "bin/test"

      # makepkg won't run as root either. The app itself is built here for
      # the first time, with the update source set.
      - name: Build the package
        env:
          TETHER_REPO: ${{ github.repository }}
        run: su builder -c "cd pkgbuild && TETHER_REPO=$TETHER_REPO makepkg -f --nodeps"

      - name: Self-test
        run: su builder -c "QT_QPA_PLATFORM=offscreen build/tether --self-test"

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: pkgbuild/tether-[0-9]*-x86_64.pkg.tar.zst

  # Built on the oldest supported Ubuntu, so the AppImage runs on it and
  # anything newer, with Qt inside. Qt Serial Port lets it open serial ports
  # itself where picocom isn't installed.
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfuse2 file

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qtserialport'
          cache: true

      - name: Test
        env:
          QMAKE: qmake
        run: bin/test

      - name: Build Tether
        env:
          QMAKE: qmake
          TETHER_REPO: ${{ github.repository }}
        run: bin/build

      - name: Package the AppImage
        run: |
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          version=$(sed -n 's/^VERSION = //p' tether.pro)
          export QML_SOURCES_PATHS="$PWD/src" EXTRA_QT_MODULES="svg" LDAI_OUTPUT="Tether-$version-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/tether \
            -d pkgbuild/tether.desktop -i pkgbuild/tether.svg --plugin qt --output appimage

      - name: Self-test the AppImage
        run: QT_QPA_PLATFORM=offscreen ./Tether-*-x86_64.AppImage --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Tether-*-x86_64.AppImage

  # Windows 10 1809 and later: ConPTY for terminals, the built-in OpenSSH
  # client for ssh, Qt Serial Port for COM ports, and Credential Manager for
  # vault passwords. Inno Setup makes a per-user installer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: 'win64_msvc2022_64'
          modules: 'qtserialport'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build Tether
        shell: cmd
        env:
          TETHER_REPO: ${{ github.repository }}
        run: |
          mkdir build
          cd build
          qmake ..\tether.pro CONFIG+=release
          nmake

      - name: Gather Qt beside it
        shell: cmd
        run: windeployqt --release --qmldir src --no-translations --no-system-d3d-compiler --no-opengl-sw build\bin\tether.exe

      # tether.exe is a GUI program, so its report goes through a file.
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process build\bin\tether.exe -ArgumentList '--self-test','tether-windows.png' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt
          Get-Content selftest-err.txt
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: tether-windows.png

      - name: Make the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path tether.pro -Pattern '^VERSION = (.+)$').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DSource=$PWD\build\bin" packaging\windows\tether.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Tether-*-setup.exe

  publish:
    needs: [arch, appimage, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CI screenshot is for checking the build, not for downloading.
          rm -f dist/*.png
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Tether ${GITHUB_REF_NAME#v}" --generate-notes
          fi
